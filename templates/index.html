<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real-time Vehicle Detection</title>
    <style>
        .container {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
        }
        .video {
            margin-right: 40px;
        }
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h2>Upload a Video for Real-Time Vehicle Detection</h2>
    <form action="/upload" method="POST" enctype="multipart/form-data">
        <input type="file" name="video" accept="video/*" required>
        <button type="submit">Upload & Stream</button>
    </form>

    {% if stream %}
    <div class="container">
        <div class="video">
            <h3>Detection Stream:</h3>
            <img src="{{ url_for('video_feed', filename=video) }}" width="720">
        </div>
    <script>
        setInterval(() => {
            fetch('/counts')
                .then(response => response.json())
                .then(data => {
                    document.getElementById("car-count").textContent = data.car;
                    document.getElementById("bus-count").textContent = data.bus;
                    document.getElementById("truck-count").textContent = data.truck;
                    document.getElementById("motorbike-count").textContent = data.motorbike;
                });
        }, 1000); // Poll every second
    </script>
    {% endif %}
</body>
</html>
